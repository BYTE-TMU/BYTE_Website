<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYTE has moved — redirecting…</title>
<meta http-equiv="refresh" content="12;url=https://tmubyte.com">
<link rel="icon" type="image/png" href="/BYTE-Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #111111;
    --border: #222222;
    --text: #ffffff;
    --text-secondary: #888888;
    --accent: #4ade80;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 32px;
    animation: fade-in 0.6s ease both;
  }

  .logo {
    width: 140px;
    height: auto;
    margin: 0 auto 28px;
    display: block;
  }

  h1 {
    font-weight: 900;
    letter-spacing: -0.02em;
    font-size: 1.75rem;
    margin: 0 0 16px;
  }

  p {
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.5;
    margin: 0 0 28px;
  }

  .progress {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin: 0 0 28px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    animation: fill-bar 12s linear forwards;
    transition: width 200ms ease;
  }

  .cta {
    display: inline-block;
    background: var(--accent);
    color: #000000;
    font-weight: 600;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 8px;
    transition: transform 200ms ease, box-shadow 200ms ease, background-color 200ms ease;
  }

  .cta:hover {
    background-color: #5ee896;
    transform: translateY(-1px);
  }

  .cta:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.5);
  }

  .cta:active {
    transform: translateY(0);
  }

  .url {
    margin: 24px 0 0;
    font-family: ui-monospace, "Fira Code", monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-secondary);
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fill-bar {
    from { width: 0%; }
    to { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card {
      animation: none;
    }

    .progress-fill {
      animation: none;
      width: 100%;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/BYTE-Logo.png" alt="BYTE">
    <h1>WE'VE MOVED.</h1>
    <p>
      This site is no longer active.<br>
      You're being redirected to the new BYTE site.
    </p>
    <div class="progress" aria-hidden="true">
      <div class="progress-fill"></div>
    </div>
    <a class="cta" href="https://tmubyte.com">TAKE ME THERE NOW →</a>
    <p class="url">https://tmubyte.com</p>
  </div>
  <script>
    setTimeout(function () {
      window.location.replace("https://tmubyte.com");
    }, 12000);
  </script>
</body>
</html>
